<body>
<header><div class="wrap"><h1>DAYSON JEOTEKNİK</h1><div class="sub">Makine • Envanter • Stok • Bakım • Arıza • İş • Tedarik</div></div></header>
<div class="wrap">
<div id="home">
<input id="search" class="search" placeholder="Makine, malzeme, personel veya araç ara..." oninput="globalSearch()" autocomplete="off"><div id="globalSearchResults" class="global-search-results hidden"></div>
<div class="category-menu"><button class="category-main" onclick="toggleMainCategories()">☰ Kategoriler <span id="categoryArrow">▼</span></button><div id="mainCategories" class="category-list hidden" aria-hidden="true"><button onclick="categoryMachines()">🔧 Makineler</button><button onclick="categoryDieselFuel()">⛽ Dizel Makineler ve Araçlar</button><button onclick="categoryPersonnel()">👥 Personel</button><button onclick="categoryStock()">📦 Stok / Depo</button><button onclick="categoryLodging()">🏠 Konaklama</button><button onclick="categoryVehicles()">🚚 Araçlar</button><button onclick="categoryPurchases()">🧾 Alımlar</button><button onclick="exportData()">💾 Yedek Al</button></div></div><div id="categorySubmenu" class="category-submenu hidden"></div>

<div id="machine" class="hidden"></div><div id="companyVehicles" class="hidden"></div><div id="purchases" class="hidden"></div><div id="depot" class="hidden"></div><div id="personnelDirectory" class="hidden"></div><div id="lodging" class="hidden"></div><div id="externalLodging" class="hidden"></div>
</div>
<script>
const CFG={"machines": [["M001", "Paletli TSM 4 Silindir", "Paletli"], ["M002", "Paletli TSM 6 Silindir", "Paletli"], ["M003", "Kamyon Üstü TSM", "Kamyon Üstü"], ["M004", "Tysim KR 150 Yeşil", "Paletli"], ["M005", "Tysim KR 150 Sarı", "Paletli"], ["M006", "Tysim 240 Sarı", "Paletli"], ["M007", "Konteyner Santral Otomatik Enjeksiyon Pompası", "Konteyner"], ["M008", "Tekerlekli Santral Yarı Otomatik Enjeksiyon Pompası", "Tekerlekli"], ["M009", "Tekerlekli Elektrikli Enjeksiyon Pompası", "Tekerlekli"], ["M010", "Tekerlekli Dizel Enjeksiyon Pompası", "Tekerlekli"], ["M011", "110 kW'lık Taşımalı Genpower Jeneratör", "Jeneratör"]], "initial": {"M001": [["HQ", 9, "adet"], ["B Tij", 7, "adet"], ["NQ", 0, "adet"], ["HQ Adaptör", 1, "adet"], ["Manevra Başlığı", 1, "adet"], ["Darbe Başlığı", 1, "adet"], ["SPT Tüpü Başlığı", 4, "adet"], ["SPT Tüp", 1, "adet"], ["HQ Çene", 3, "adet"], ["B Tij Çene", 4, "adet"], ["B Tij Top Matkap", 3, "adet"], ["Manevra Başlığı HQ", 1, "adet"], ["Manevra Başlığı B.Tij", 1, "adet"], ["Su Başlığı", 1, "adet"], ["Tank 1 tonluk", 1, "adet"], ["Emici", 2, "adet"], ["Su Termosu", 1, "adet"], ["Sehpa", 2, "adet"]], "M002": [["HQ", 9, "adet"], ["NQ", 0, "adet"], ["B. Tij", 7, "adet"], ["54 mm Manevra Başlığı", 1, "adet"], ["54 mm Su Başlığı", 1, "adet"], ["HQ Adaptör", 2, "adet"], ["Darbe Başlığı", 1, "adet"], ["HQ Adaptörlü Kelebek Matkap", 1, "adet"], ["Gres Pompası", 1, "adet"], ["Emici Hortum", 1, "adet"], ["Su Hortumu", 30, "metre"], ["Vidye HQ", 1, "adet"], ["Top Matkap", 1, "adet"]], "M003": [["HQ", 8, "adet"], ["BTJ", 7, "adet"], ["NQ", 0, "adet"], ["HQ Adaptör", 2, "adet"], ["Su Başlığı", 1, "adet"], ["SPT Tüpü", 1, "adet"], ["Manevra Başlığı", 1, "adet"], ["Midye HQ", 2, "adet"], ["Top Matkap", 1, "adet"]]}, "tools": {"M001": ["24-36 Boru Anahtarı", "Çekiç", "Huni", "24 Yıldız Anahtar", "32 Yıldız Anahtar", "30 Yıldız Anahtar", "Gres Pompası", "25-28 Çatal Anahtar", "24-26 Çatal Anahtar", "22-20 Çatal Anahtar", "14 Y Çatal Anahtar", "10-11 Çatal Anahtar", "6-8 Alyan", "Terazi", "Metre", "Tabela", "Takım Sandığı", "Spatula", "Şemsiye", "İngiliz Anahtarı"], "M002": ["İngiliz Anahtarı", "Kerpeten", "28-25 Anahtar", "24-26 Anahtar", "32-27 Anahtar", "22-20 Anahtar", "23-21 Anahtar", "19-18 Anahtar", "22 Yıldız Anahtar", "18-19 Yıldız Anahtar", "14-15 Anahtar", "Alyan 6", "Alyan 8", "Alyan 10", "Alyan 12", "Çekiç", "Termos"], "M003": ["Kerpeten", "27 Yıldız Çatal Anahtarı", "19 Yıldız Çatal Anahtarı", "22 Yıldız Çatal Anahtar", "17 Yıldız Çatal Anahtar", "13 Yıldız Çatal Anahtar", "14 Yıldız Çatal Anahtar", "30-32 Çatal Anahtar", "20-22 Çatal Anahtar", "16-17 Çatal Anahtar", "25-25 Çatal Anahtar", "24-26 Çatal Anahtar", "18-19 Çatal Anahtar", "10-11 Çatal Anahtar", "Çekiç", "Düz Tornavida", "Takım Sandığı", "Su Termosu", "Gres Pompası", "Emici Hortum", "Tank 3'lü"]}};
const KEY="dyson_jeoteknik_v1";
let state=loadState(), current=null, section="inventory";

function ensureRegistrationVehicles(){
  state.companyVehicles ||= [];
  const regs=[
    {name:"Fiat Ducato",model:"2025",plate:"16 BTS 746",insurance:"24.07.2027",inspection:"11.06.2027",note:"Ruhsattan işlendi"},
    {name:"Mitsubishi K14TJUNSL",model:"1999",plate:"16 CCN 854",insurance:"09.07.2027",inspection:"21.07.2027",note:"Ruhsattan işlendi"},
    {name:"Özesan Lowbed",model:"2020",plate:"16 BNE 392",insurance:"—",inspection:"22.04.2027",note:"Sigorta bilgisi yok"},
    {name:"Mitsubishi L300 DLX",model:"2005",plate:"16 EEN 51",insurance:"18.11.2026",inspection:"24.12.2025",note:""},
    {name:"Fiat Doblo",model:"2006",plate:"16 BIG 220",insurance:"02.06.2027",inspection:"20.11.2026",note:""},
    {name:"Fiat Fiorino",model:"2017",plate:"16 TCG 59",insurance:"26.11.2026",inspection:"11.06.2027",note:""},
    {name:"Volvo FH Çekici",model:"2012",plate:"34 FS 180",insurance:"09.03.2027",inspection:"11.06.2027",note:""},
    {name:"Dodge Kamyonet",model:"—",plate:"16 BRZ 904",insurance:"19.05.2027",inspection:"09.01.2026",note:"Ruhsat bekleniyor"},
    {name:"Audi",model:"—",plate:"16 EDG 66",insurance:"30.05.2027",inspection:"24.05.2027",note:"Ruhsat bekleniyor"}
  ];
  for(const r of regs){
    let x=state.companyVehicles.find(v=>v.vals && (v.vals[2]||"").replace(/\s/g,"")===r.plate.replace(/\s/g,""));
    if(!x){ x={vals:Array(11).fill("")}; state.companyVehicles.push(x); }
    x.vals[0]=r.name; x.vals[1]=r.model; x.vals[2]=r.plate;
    x.vals[8]="Aktif"; x.vals[9]=r.insurance+" / "+r.inspection; x.vals[10]=r.note;
  }
  save();
}
ensureRegistrationVehicles();

function ensureCurrentPersonnel(){
 state.personnelDirectory ||= [];
 const people = [
    ["Fırat Yelkence", "Malzeme Tedarikçisi", "Ducato Pikap", "Aktif", "Yok"],
    ["Kadir Koç", "Operatör", "TSM 4 Silindir", "Aktif", "Yok"],
    ["Yılmaz Karaca", "Yardımcı", "TSM 4 Silindir", "Aktif", "Yok"],
    ["Yakup Yasin Öztürk", "Yardımcı / Depo Sorumlusu", "TSM 4 Silindir", "Aktif", "Yok"],
    ["Salih Çiçek", "Makine Yağcısı", "Tysim KR 150 Sarı", "Aktif", "Yok"],
    ["Nevzat Ferik", "Makine Yağcısı", "Tysim KR 150 Sarı", "Aktif", "Oda 1"],
    ["Mehmet Kaya", "Makine Yağcısı", "Tysim KR 150 Sarı", "Aktif", "Yok"],
    ["Furkan Nure", "Operatör", "Tysim KR 150 Yeşil", "Aktif", "Şantiye Dışı"],
    ["Fadıl Tüzün", "Makine Yağcısı", "Tysim KR 150 Yeşil", "Aktif", "Şantiye Dışı"],
    ["Doğan İşcan", "Operatör", "Konteyner Tam Otomatik Santral", "Aktif", "Şantiye Dışı"],
    ["Kemal Korkut", "Santral Operatörü", "Tekerlekli Yarı Otomatik Santral", "Aktif", "Kendi evi / Azat Mahallesi"],
    ["Ümit Kabakçı", "Operatör", "Kamyon Üstü TSM", "Aktif", "Oda 4"],
    ["Murat Çolakoğlu", "Yardımcı", "Kamyon Üstü TSM", "Aktif", "Oda 4"],
    ["Süleyman Sarmaşık Çelebi", "Operatör", "TSM 6 Silindir", "Aktif", "Oda 5"],
    ["Vedat Demir", "Yardımcı", "TSM 6 Silindir", "Aktif", "Yok"],
    ["Bilal Bayındır", "Yardımcı", "TSM 6 Silindir", "Aktif", "Yok"],
    ["Murat Yatmaz", "Kaynakçı", "Saha", "Aktif", "Oda 6"]
]
 for(const p of people){
   if(!state.personnelDirectory.some(x=>x.vals && x.vals[0]===p[0])){
     const group = ["Mühendis","Muhasebe","Proje"].includes(p[1]) ? p[1] : "Saha Çalışanları";
     state.personnelDirectory.push({vals:[p[0],group,p[1],p[3],p[2],p[4],""]});
   }
 }
 save();
  const corrections = [
    ["Salih Çiçek","Operatör","Tysim KR 150 Sarı"],
    ["Nevzat Ferik","Yağcı","Tysim KR 150 Sarı"],
    ["Mehmet Kaya","Makine Yağcısı","Tysim KR 150 Sarı"],
    ["Furkan Nure","Operatör","Tysim KR 150 Yeşil"],
    ["Fadıl Tüzün","Makine Yağcısı","Tysim KR 150 Yeşil"],
    ["Doğan İşcan","Operatör","Konteyner Tam Otomatik Santral"]
  ];
  for(const c of corrections){
    const p=state.personnelDirectory.find(x=>x.vals && x.vals[0]===c[0]);
    if(p){ p.vals[2]=c[1]; p.vals[4]=c[2]; }
    else state.personnelDirectory.push({vals:[c[0],"Saha Çalışanları",c[1],"Aktif",c[2],"Yok",""]});
  }

}
ensureCurrentPersonnel();
state.personnelDirectory=(state.personnelDirectory||[]).filter(x=>{
  return x && Array.isArray(x.vals) && String(x.vals[0]||"").trim().length>1;
});
save();



function loadState(){
 let raw=null;
 try{raw=localStorage.getItem(KEY);}catch(e){raw=null;}
 if(!raw && window.__DYSON_MEMORY_STATE) return window.__DYSON_MEMORY_STATE;
 if(raw){
   try{
     const s=JSON.parse(raw);
     s.stock ||= {}; s.tools ||= {}; s.logs ||= []; s.maint ||= []; s.fails ||= [];
     s.works ||= []; s.supplies ||= []; s.daily ||= []; s.personnel ||= [];
     s.depot ||= []; s.rooms ||= []; s.lodgingAssets ||= []; s.externalLodging ||= []; s.personnelDirectory ||= []; s.companyVehicles ||= []; s.purchases ||= []; s.vehicleDriverHistory ||= []; s.vehicleAssignments ||= []; s.personnelDirectory ||= []; s.vehicleDriverHistory ||= []; s.personnelDirectory ||= [];
     for(const [id,rows] of Object.entries(CFG.initial)){
       if(!Array.isArray(s.stock[id]) || s.stock[id].length===0){
         s.stock[id]=rows.map((x,i)=>({id:"i"+i,name:x[0],qty:x[1],unit:x[2],note:""}));
       }
     }
     for(const [id,arr] of Object.entries(CFG.tools)){
       if(!Array.isArray(s.tools[id]) || s.tools[id].length===0)
         s.tools[id]=arr.map((x,i)=>({id:"t"+i,name:x,qty:"",note:""}));
     }
     for(const [id] of CFG.machines){s.stock[id] ||= [];s.tools[id] ||= [];}
     if(!s.personnelDirectory.some(x=>x.vals && x.vals[0]==="Murat Yatmaz")){
       s.personnelDirectory.push({vals:["Murat Yatmaz","Saha Çalışanları","Kaynakçı","Aktif","","",""]});
     }
     const room6=s.rooms.find(x=>x.vals && x.vals[0]==="6");
     if(room6 && !room6.vals[1]) room6.vals[1]="Murat Yatmaz";
     if(s.rooms.length===0){
       for(let i=1;i<=10;i++) s.rooms.push({vals:[String(i),"","", "2 kişilik oda"]});
     }
     if(s.lodgingAssets.length===0){
       s.lodgingAssets.push({vals:["Buzdolabı","1","Ortak alan","Mevcut",""]});
       s.lodgingAssets.push({vals:["Çamaşır Makinesi","1","Ortak alan","Mevcut",""]});
     }
     return s;
   }catch(e){}
 }
 const s={stock:{},tools:{},logs:[],maint:[],fails:[],works:[],supplies:[],daily:[],personnel:[],depot:[],rooms:[],lodgingAssets:[],externalLodging:[],personnelDirectory:[]};
 for(const [id,rows] of Object.entries(CFG.initial))
   s.stock[id]=rows.map((x,i)=>({id:"i"+i,name:x[0],qty:x[1],unit:x[2],note:""}));
 for(const [id,arr] of Object.entries(CFG.tools))
   s.tools[id]=arr.map((x,i)=>({id:"t"+i,name:x,qty:"",note:""}));
 for(const [id] of CFG.machines){s.stock[id] ||= [];s.tools[id] ||= [];}
 for(let i=1;i<=10;i++) s.rooms.push({vals:[String(i),"","", "2 kişilik oda"]});
 s.lodgingAssets.push({vals:["Buzdolabı","1","Ortak alan","Mevcut",""]});
 s.lodgingAssets.push({vals:["Çamaşır Makinesi","1","Ortak alan","Mevcut",""]});
 return s;
}
function save(){
 try{localStorage.setItem(KEY,JSON.stringify(state));}
 catch(e){window.__DYSON_MEMORY_STATE=state;}
}
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function machine(id){return CFG.machines.find(x=>x[0]===id);}

function ensureDSMDrillStock(){
 state.depot ||= [];
 if(!state.depot.some(x => x.name === "DSM Matkabı" && x.location === "Depo")){
   state.depot.push({
     id:"Depo-DSM-Matkabı",
     location:"Depo",
     name:"DSM Matkabı",
     qty:1,
     unit:"adet",
     min:0,
     spare:"Hayır",
     note:"Tysim KR150 ekipmanı — fotoğraftaki matkap",
     lastIn:new Date().toLocaleDateString("tr-TR")
   });
   save();
 }
}
function depotView(){
 ensureDSMDrillStock();

 document.getElementById("home").classList.add("hidden");
 document.getElementById("machine").classList.add("hidden");
 const d=document.getElementById("depot"); d.classList.remove("hidden");
 const rows=state.depot||[];
 const renderLocation=(loc)=>{
  const rr=rows.filter(x=>x.location===loc);
  return `<div class="panel"><h3>${loc}</h3>
  <div class="formgrid">
   <input id="${loc}Name" placeholder="Malzeme adı">
   <input id="${loc}Qty" type="number" step="any" placeholder="Miktar">
   <input id="${loc}Unit" placeholder="Birim (adet, m, lt...)">
   <input id="${loc}Min" type="number" step="any" placeholder="Minimum stok">
   <input id="${loc}Spare" placeholder="Yedek mi? (Evet/Hayır)">
   <input id="${loc}Note" placeholder="Not">
  </div>
  <div class="actions"><button class="green" onclick="addDepot('${loc}')">Stok Ekle</button></div>
  <table><tr><th>Malzeme</th><th>Mevcut</th><th>Birim</th><th>Min. Stok</th><th>Yedek</th><th>Son Durum</th><th>İşlem</th></tr>
  ${rr.map(x=>{
    const critical=Number(x.qty)<=Number(x.min||0);
    return `<tr><td>${esc(x.name)}</td><td><input style="width:85px" type="number" step="any" value="${x.qty}" onchange="setDepotQty('${x.id}',this.value)"></td><td>${esc(x.unit)}</td><td>${x.min||0}</td><td>${esc(x.spare||"")}</td><td>${critical?"⚠️ Kritik":"Normal"}</td><td><button onclick="editDepot('${x.id}')">Düzenle</button> <button class="red" onclick="delDepot('${x.id}')">Sil</button></td></tr>`;
  }).join("")}</table></div>`;
 };
 d.innerHTML=`<div class="panel"><button class="gray" onclick="closeDepot()">← Ana Sayfa</button><h2>📦 Depo Stok</h2>
 <div class="notice">Depo stokları makine stoklarından ayrı tutulur. Alt konteyner ve üst konteyner ayrı takip edilir.</div></div>
 ${renderLocation("Alt Konteyner")}${renderLocation("Üst Konteyner")}${renderLocation("Depo")}`;
}
function addDepot(loc){
 state.depot ||= [];
 const id=loc==="Alt Konteyner"?"Alt":"Ust";
 const val=n=>document.getElementById(id+n).value;
 const name=val("Name").trim();
 if(!name)return alert("Malzeme adını yaz.");
 state.depot.push({id:loc+"-"+Date.now(),location:loc,name,qty:Number(val("Qty")||0),unit:val("Unit")||"adet",min:Number(val("Min")||0),spare:val("Spare"),note:val("Note"),lastIn:new Date().toLocaleDateString("tr-TR")});
 save();depotView();
}
function setDepotQty(id,v){
 const r=(state.depot||[]).find(x=>x.id===id);if(r){r.qty=Number(v||0);r.lastChange=new Date().toLocaleDateString("tr-TR");save();}
}
function editDepot(id){
  const r=(state.depot||[]).find(x=>x.id===id); if(!r)return;
  const name=prompt("Malzeme adı:",r.name??""); if(name===null)return;
  const qty=prompt("Miktar:",r.qty??""); if(qty===null)return;
  const unit=prompt("Birim:",r.unit??"adet"); if(unit===null)return;
  const min=prompt("Minimum stok:",r.min??0); if(min===null)return;
  const spare=prompt("Yedek mi? (Evet/Hayır):",r.spare??""); if(spare===null)return;
  const note=prompt("Not:",r.note??""); if(note===null)return;
  r.name=name.trim(); r.qty=Number(qty||0); r.unit=unit||"adet"; r.min=Number(min||0); r.spare=spare; r.note=note;
  r.lastChange=new Date().toLocaleDateString("tr-TR"); save(); depotView();
}
function delDepot(id){
 if(confirm("Bu depo stok kaydı silinsin mi?")){state.depot=state.depot.filter(x=>x.id!==id);save();depotView();}
}
function closeDepot(){document.getElementById("depot").classList.add("hidden");renderHome();}


function lodgingView(){
 document.getElementById("home").classList.add("hidden");
 document.getElementById("machine").classList.add("hidden");
 document.getElementById("depot").classList.add("hidden");
 document.getElementById("externalLodging").classList.add("hidden");document.getElementById("lodging").classList.add("hidden");
 const d=document.getElementById("lodging"); d.classList.remove("hidden");
 const rooms=state.rooms||[];

function categoryDieselFuel(){
  state.fuelLogs ||= [];
  const machines=(CFG.machines||[]).filter(m=>!(/elektrik/i.test(String(m[1]||""))));
  const vehicles=state.companyVehicles||[];
  const generators=state.generators||[];
  const s=document.getElementById("categorySubmenu");
  s.classList.remove("hidden");

  const rows=[];
  machines.forEach(m=>rows.push({type:"Makine",name:m[1],code:m[0]}));
  vehicles.forEach((x,i)=>{const v=x.vals||[]; rows.push({type:"Araç",name:v[0]||"Araç",code:"V"+i});});
  generators.forEach((x,i)=>{const v=x.vals||x; rows.push({type:"Jeneratör",name:v[0]||"Jeneratör",code:"G"+i});});

  const total=(name)=>state.fuelLogs.filter(x=>x.name===name).reduce((a,x)=>a+Number(x.liters||0),0);
  s.innerHTML=`<div class="subhead">⛽ Dizel Makineler, Araçlar ve Jeneratörler</div>
    <div class="panel">
      <div class="notice">Yakıt tek seferlik kayıt değildir. Her yakıt ikmalini gün gün ayrı kaydedebilirsin. Toplam tüketim otomatik hesaplanır.</div>
      <div class="actions">
        <button class="green" onclick="showFuelEntry()">＋ Günlük Yakıt İkmali Ekle</button>
        <button onclick="showFuelHistory()">📋 Yakıt Geçmişi</button>
      </div>
      <h3>🔧 Dizel Makineler</h3>
      <table><tr><th>Makine</th><th>Bugüne kadar toplam (L)</th><th>Son ikmal</th></tr>
      ${machines.map(m=>{
        const logs=state.fuelLogs.filter(x=>x.name===m[1]);
        const last=logs.length?logs[logs.length-1]:null;
        return `<tr><td>${esc(m[1])}</td><td><b>${total(m[1]).toFixed(1)}</b></td><td>${last?esc(last.date)+" • "+esc(last.liters)+" L":"—"}</td></tr>`;
      }).join("")}</table>
      <h3>🚚 Dizel Araçlar</h3>
      <table><tr><th>Araç</th><th>Plaka</th><th>Toplam (L)</th><th>Son ikmal</th></tr>
      ${vehicles.map(x=>{
        const v=x.vals||[], name=v[0]||"Araç", logs=state.fuelLogs.filter(x=>x.name===name), last=logs.length?logs[logs.length-1]:null;
        return `<tr><td>${esc(name)}</td><td>${esc(v[2]||"")}</td><td><b>${total(name).toFixed(1)}</b></td><td>${last?esc(last.date)+" • "+esc(last.liters)+" L":"—"}</td></tr>`;
      }).join("")}</table>
      <h3>⚡ Jeneratörler</h3>
      <table><tr><th>Jeneratör</th><th>Toplam (L)</th><th>Son ikmal</th></tr>
      ${generators.map(x=>{
        const v=x.vals||x, name=v[0]||"Jeneratör", logs=state.fuelLogs.filter(x=>x.name===name), last=logs.length?logs[logs.length-1]:null;
        return `<tr><td>${esc(name)}</td><td><b>${total(name).toFixed(1)}</b></td><td>${last?esc(last.date)+" • "+esc(last.liters)+" L":"—"}</td></tr>`;
      }).join("")}</table>
    </div>`;
}

function showFuelEntry(){
  state.fuelLogs ||= [];
  const s=document.getElementById("categorySubmenu");
  const machines=(CFG.machines||[]).filter(m=>!(/elektrik/i.test(String(m[1]||""))));
  const vehicles=state.companyVehicles||[];
  const generators=state.generators||[];
  const opts=[
    ...machines.map(m=>`<option value="${esc(m[1])}">Makine • ${esc(m[1])}</option>`),
    ...vehicles.map(x=>{const v=x.vals||[];return `<option value="${esc(v[0]||"")}">Araç • ${esc(v[0]||"")} • ${esc(v[2]||"")}</option>`}),
    ...generators.map(x=>{const v=x.vals||x;return `<option value="${esc(v[0]||"")}">Jeneratör • ${esc(v[0]||"")}</option>`})
  ];
  s.innerHTML=`<div class="subhead">⛽ Günlük Yakıt İkmali</div><div class="panel">
    <div class="formgrid">
      <input id="fuelDate" type="date" value="${new Date().toISOString().slice(0,10)}">
      <select id="fuelTarget">${opts.join("")}</select>
      <input id="fuelLiters" type="number" min="0" step="0.1" placeholder="İkmal miktarı (Litre)">
      <input id="fuelKm" placeholder="KM / Sayaç (varsa)">
      <input id="fuelNote" placeholder="Not">
    </div>
    <div class="actions"><button class="green" onclick="saveFuelEntry()">Kaydet</button><button class="gray" onclick="categoryDieselFuel()">Vazgeç</button></div>
  </div>`;
}
function saveFuelEntry(){
  const date=document.getElementById("fuelDate").value;
  const name=document.getElementById("fuelTarget").value;
  const liters=Number(document.getElementById("fuelLiters").value);
  if(!date||!name||!(liters>0))return alert("Tarih, araç/makine ve litre miktarı zorunlu.");
  state.fuelLogs ||= [];
  state.fuelLogs.push({
    date,name,liters,
    km:document.getElementById("fuelKm").value.trim(),
    note:document.getElementById("fuelNote").value.trim()
  });
  state.fuelLogs.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  save(); categoryDieselFuel();
}
function showFuelHistory(){
  state.fuelLogs ||= [];
  const s=document.getElementById("categorySubmenu");
  const logs=[...state.fuelLogs].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  s.innerHTML=`<div class="subhead">📋 Günlük Yakıt Geçmişi</div><div class="panel">
    <button class="gray" onclick="categoryDieselFuel()">← Dizel Bölümüne Dön</button>
    <table><tr><th>Tarih</th><th>Makine / Araç / Jeneratör</th><th>İkmal (L)</th><th>KM / Sayaç</th><th>Not</th><th>İşlem</th></tr>
    ${logs.map((x,i)=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td><b>${esc(String(x.liters))}</b></td><td>${esc(x.km||"")}</td><td>${esc(x.note||"")}</td><td><button class="red" onclick="deleteFuelLog(${state.fuelLogs.indexOf(x)})">Sil</button></td></tr>`).join("")}
    </table>
  </div>`;
}
function deleteFuelLog(i){
  if(confirm("Bu yakıt ikmali kaydı silinsin mi?")){
    state.fuelLogs.splice(i,1); save(); showFuelHistory();

function vehicleDateStatus(value){
  const s=String(value||"").trim();
  if(!/^\d{2}\.\d{2}\.\d{4}$/.test(s)) return {text:s||"—",cls:""};
  const [d,m,y]=s.split(".").map(Number);
  const dt=new Date(y,m-1,d); const today=new Date(2026,7,11);
  dt.setHours(0,0,0,0); today.setHours(0,0,0,0);
  if(dt<today) return {text:s+" • SÜRESİ GEÇTİ",cls:"expired-date"};
  if(dt.getTime()===today.getTime()) return {text:s+" • BUGÜN",cls:"today-date"};
  return {text:s,cls:""};
}

    hits.push({type:"Kategori",label:"⛽ Dizel Makineler ve Araçlar",fn:"categoryDieselFuel()"});
  }
  (CFG.machines||[]).forEach(m=>{

      hits.push({type:"Makine",label:m[0]+" • "+m[1],fn:`openMachineFromSearch('${m[0]}')`});
    (state.stock[m[0]]||[]).forEach(x=>{
      if(String(x.name||"").toLocaleLowerCase("tr-TR").includes(q))
        hits.push({type:"Envanter",label:m[0]+" • "+m[1]+" • "+x.name,fn:`openMachineFromSearch('${m[0]}')`});
    });
  });
  (state.depot||[]).forEach((x,i)=>{
    const v=[x.name,x.qty,x.unit,x.note].join(" ");
    if(v.toLocaleLowerCase("tr-TR").includes(q))
      hits.push({type:"Depo",label:x.name+" • "+(x.qty??"")+" "+(x.unit??""),fn:"depotView()"});
  });
  (state.personnelDirectory||[]).forEach((x,i)=>{
    const v=(x.vals||[]).join(" ");
    if(v.toLocaleLowerCase("tr-TR").includes(q))
      hits.push({type:"Personel",label:(x.vals||[]).filter(Boolean).join(" • "),fn:"personnelDirectoryView()"});
  });
  (state.companyVehicles||[]).forEach((x,i)=>{
    const v=(x.vals||[]).join(" ");
    if(v.toLocaleLowerCase("tr-TR").includes(q))
      hits.push({type:"Araç",label:(x.vals||[]).slice(0,4).filter(Boolean).join(" • "),fn:"companyVehiclesView()"});
  });
  (state.purchases||[]).forEach((x,i)=>{
    const v=(x.vals||x).join(" ");
    if(v.toLocaleLowerCase("tr-TR").includes(q))
      hits.push({type:"Alınan",label:(x.vals||x).filter(Boolean).join(" • "),fn:"purchasesView()"});
  });
  if(!hits.length){
    box.innerHTML=`<div class="search-empty">“${esc(q)}” için kayıt bulunamadı.</div>`;

  }

function machinePersonnelFor(id){
 const rows=(state.personnelDirectory||[]).filter(x=>x && Array.isArray(x.vals) && String(x.vals[0]||"").trim().length>1);
 const match={
  M001:v=>/TSM 4 Silindir/i.test(v),
  M002:v=>/TSM 6 Silindir/i.test(v),
  M003:v=>/Kamyon Üstü TSM/i.test(v),
  M004:v=>/Tysim KR 150 Yeşil/i.test(v),
  M005:v=>/Tysim KR 150 Sarı/i.test(v),
  M006:v=>/Tysim 240 Sarı/i.test(v),
  M007:v=>/Konteyner Tam Otomatik Santral/i.test(v),
  M008:v=>/Tekerlekli Yarı Otomatik Santral/i.test(v),
  M009:v=>/Tekerlekli Elektrikli/i.test(v),
  M010:v=>/Tekerlekli Dizel/i.test(v),
  M011:v=>/Jeneratör/i.test(v)
 };
 const fn=match[id];
 if(id==="M004"){
  const names=["Furkan Nure","Fadıl Tüzün"];
  return rows.filter(x=>names.includes(String(x.vals[0]||"")) && /Tysim KR 150 Yeşil/i.test(String(x.vals[4]||"")));
 }
 if(id==="M005"){
  const names=["Salih Çiçek","Nevzat Ferik","Mehmet Kaya"];
  return rows.filter(x=>names.includes(String(x.vals[0]||"")) && /Tysim KR 150 Sarı/i.test(String(x.vals[4]||"")));
 }
 return fn?rows.filter(x=>fn(String(x.vals[4]||""))):rows.filter(x=>String(x.vals[4]||"")===String(machine(id)?.[1]||""));
}

 const stock=state.stock[current]||[],tools=state.tools[current]||[];

 ${people.length?`<div class="tablewrap"><table class="machine-personnel-table">

 ${people.map(x=>`<tr><td><b>${esc(x.vals[0])}</b></td><td>${esc(x.vals[2]||"-")}</td><td>${esc(x.vals[3]||"Aktif")}</td><td>${esc(x.vals[5]||"-")}</td></tr>`).join("")}
 </table></div>`:'<div class="notice">Bu makineye atanmış kayıtlı personel yok.</div>'}
 <div class="actions">
  <button onclick="section='personnel';renderMachine()">Personel Durumu / Güncelle</button>
  <button class="green" onclick="showAddMachinePersonnel()">＋ Personel Ekle</button>
  <button onclick="showChangeMachinePersonnel()">↔ Personel Değiştir</button>
</div>
<div id="machinePersonnelForm" class="hidden"></div></div>`;
 el.innerHTML=`<div class="panel"><button class="gray" onclick="renderHome()">← Makineler</button>
 <button onclick="editMachine(current)">✎ Makineyi Düzenle</button><h2>${esc(m[1])}</h2><div class="muted">${m[0]} • ${esc(m[2])}${/elektrik/i.test(String(m[1]||""))?"":` • Yakıt: ${esc(m[4]||"—")} L`}</div>
 <div class="actions">
 <button onclick="section='inventory';renderMachine()">Envanter</button>

 <button onclick="section='fixed';renderMachine()">Sabit Ekipman</button>
 <button onclick="section='spare';renderMachine()">Yedekler</button>
 <button onclick="section='maint';renderMachine()">Bakım</button>
 <button onclick="section='fail';renderMachine()">Arıza</button>
 <button onclick="section='work';renderMachine()">Yapılan İş</button>
 <button onclick="section='supply';renderMachine()">Tedarik</button>
 <button onclick="section='daily';renderMachine()">Günlük Faaliyet</button>
 <button onclick="section='personnel';renderMachine()">Personel Durumu</button></div></div>${peopleHtml}`;
 if(section==="inventory") inventoryView(el,stock);
 else if(section==="tools") toolsView(el,tools);
 else if(section==="daily") dailyView(el);
 else if(section==="personnel") personnelView(el);
 else logsView(el,section);
}
function inventoryView(el,rows){
 el.innerHTML+=`<div class="panel"><h3>Envanter</h3>
 <div class="formgrid"><input id="newName" placeholder="Yeni malzeme"><input id="newQty" type="number" step="any" placeholder="Adet"><input id="newUnit" placeholder="Birim (adet, m, lt...)"><input id="newNote" placeholder="Not"></div>
 <div class="actions"><button class="green" onclick="addStock()">Malzeme Ekle</button></div>
 <table><tr><th>Malzeme</th><th>Mevcut</th><th>Birim</th><th>Not</th><th>İşlem</th></tr>
 ${rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td><input style="width:90px" type="number" step="any" value="${r.qty}" onchange="setQty(${i},this.value)"></td><td>${esc(r.unit)}</td><td>${esc(r.note)}</td><td><button onclick="useStock(${i})">Çıkış</button> <button onclick="editStock(${i})">Düzenle</button> <button class="red" onclick="delStock(${i})">Sil</button></td></tr>`).join("")}</table>
 </div>`;
}
function addStock(){let n=document.getElementById("newName").value.trim();if(!n)return alert("Malzeme adını yaz.");state.stock[current].push({id:"x"+Date.now(),name:n,qty:Number(document.getElementById("newQty").value||0),unit:document.getElementById("newUnit").value||"adet",note:document.getElementById("newNote").value||""});save();renderMachine();}
function setQty(i,v){state.stock[current][i].qty=Number(v||0);save();}
function useStock(i){let r=state.stock[current][i],v=prompt(`${r.name} için çıkış miktarı:`);if(v===null)return;v=Number(v);if(!isFinite(v)||v<=0)return alert("Geçerli miktar gir.");if(v>Number(r.qty))return alert("Stok yetersiz.");r.qty=Number(r.qty)-v;state.logs.push({date:new Date().toLocaleString("tr-TR"),machine:current,type:"Stok Çıkışı",item:r.name,qty:v});save();renderMachine();}
function editStock(i){
  const r=state.stock[current][i]; if(!r)return;
  const name=prompt("Malzeme adı:",r.name??""); if(name===null)return;
  const qty=prompt("Miktar:",r.qty??0); if(qty===null)return;
  const unit=prompt("Birim:",r.unit??"adet"); if(unit===null)return;
  const note=prompt("Not:",r.note??""); if(note===null)return;
  r.name=name.trim(); r.qty=Number(qty||0); r.unit=unit||"adet"; r.note=note; save(); renderMachine();
}
function delStock(i){if(confirm("Bu malzeme kaydı silinsin mi?")){state.stock[current].splice(i,1);save();renderMachine();}}
function toolsView(el,rows){
 el.innerHTML+=`<div class="panel"><h3>El Aletleri</h3>
 <div class="formgrid"><input id="toolName" placeholder="El aleti"><input id="toolQty" placeholder="Mevcut adet"><input id="toolNote" placeholder="Not"></div>
 <div class="actions"><button class="green" onclick="addTool()">El Aleti Ekle</button></div>
 <table><tr><th>El Aleti</th><th>Adet</th><th>Not</th><th>İşlem</th></tr>
 ${rows.map((r,i)=>`<tr><td>${esc(r.name)}</td><td><input style="width:90px" value="${esc(r.qty)}" onchange="state.tools[current][${i}].qty=this.value;save()"></td><td>${esc(r.note)}</td><td><button onclick="editTool(${i})">Düzenle</button> <button class="red" onclick="delTool(${i})">Sil</button></td></tr>`).join("")}</table></div>`;
}
function addTool(){let n=document.getElementById("toolName").value.trim();if(!n)return alert("El aleti adını yaz.");state.tools[current].push({id:"t"+Date.now(),name:n,qty:document.getElementById("toolQty").value,note:document.getElementById("toolNote").value});save();renderMachine();}
function editTool(i){
  const r=state.tools[current][i]; if(!r)return;
  const name=prompt("El aleti:",r.name??""); if(name===null)return;
  const qty=prompt("Mevcut adet:",r.qty??""); if(qty===null)return;
  const note=prompt("Not:",r.note??""); if(note===null)return;
  r.name=name.trim(); r.qty=qty; r.note=note; save(); renderMachine();
}
function delTool(i){if(confirm("Silinsin mi?")){state.tools[current].splice(i,1);save();renderMachine();}}

function dailyView(el){
 const rows=state.daily||[];

 <div class="formgrid">
 <input id="d0" type="date" value="${new Date().toISOString().slice(0,10)}">
 <input id="d1" placeholder="Şantiye / Proje">
 <input id="d2" placeholder="Yapılan faaliyet">

 <table><tr><th>Tarih</th><th>Şantiye / Proje</th><th>Faaliyet</th><th>Saat / Metraj</th><th>Ekipman</th><th>Açıklama</th><th>İşlem</th></tr>
 ${mine.map((x,i)=>`<tr>${x.vals.map(v=>`<td>${esc(v)}</td>`).join("")}<td><button onclick="editDaily(${rows.indexOf(x)})">Düzenle</button> <button class="red" onclick="delDaily(${rows.indexOf(x)})">Sil</button></td></tr>`).join("")}
 </table></div>`;
}
function addDaily(){
 state.daily ||= [];
 state.daily.push({machine:current,vals:[
  document.getElementById("d0").value,document.getElementById("d1").value,document.getElementById("d2").value,
  document.getElementById("d3").value,document.getElementById("d4").value,document.getElementById("d5").value
 ]});

}
function editDaily(i){
  const r=state.daily[i]; if(!r)return;
  const labels=["Tarih","Şantiye / Proje","Faaliyet","Saat / Metraj","Ekipman","Açıklama"], vals=r.vals.slice();
  for(let j=0;j<vals.length;j++){ const v=prompt(labels[j]+":",vals[j]??""); if(v===null)return; vals[j]=v; }
  r.vals=vals; save(); renderMachine();
}
function delDaily(i){if(confirm("Günlük faaliyet kaydı silinsin mi?")){state.daily.splice(i,1);save();renderMachine();}}

function logsView(el,type){
 const titles={fixed:"Sabit Makine Ekipmanları",spare:"Yedek Malzemeler",maint:"Bakım Zamanı / Geçmişi",fail:"Arıza Kayıtları",work:"Yapılan İşler",supply:"Tedarik"};
 const configs={
 fixed:["Ekipman","Durum","Not"],spare:["Malzeme","Mevcut","Olması gereken / Not"],maint:["Bakım","Periyot","Tarih / Saat","Sonraki bakım","Not"],fail:["Tarih","Arıza","Değişen parça","Maliyet","Durum","Not"],work:["Tarih","İş / Şantiye","Yapılan iş","Saat / Metraj","Malzeme","Not"],supply:["Tarih","Malzeme / Parça","Miktar","Tedarikçi","Fiyat","Not"]};
 const arr=state[type==="fixed"?"fixed":type==="spare"?"spare":type]||[];
 const heads=configs[type];
 let fields=heads.map((h,i)=>`<input id="f${i}" placeholder="${h}">`).join("");
 el.innerHTML+=`<div class="panel"><h3>${titles[type]}</h3><div class="formgrid">${fields}</div><div class="actions"><button class="green" onclick="addLog('${type}')">Kayıt Ekle</button></div>
 <table><tr>${heads.map(h=>`<th>${h}</th>`).join("")}<th>İşlem</th></tr>
 ${arr.filter(x=>x.machine===current).map((x,i)=>`<tr>${heads.map((h,j)=>`<td>${esc(x.vals[j]||"")}</td>`).join("")}<td><button onclick="editLog('${type}',${state[type==="fixed"?"fixed":type==="spare"?"spare":type].indexOf(x)})">Düzenle</button> <button class="red" onclick="delLog('${type}',${state[type==="fixed"?"fixed":type==="spare"?"spare":type].indexOf(x)})">Sil</button></td></tr>`).join("")}</table></div>`;
}
function addLog(type){
 const map={fixed:"fixed",spare:"spare",maint:"maint",fail:"fail",work:"work",supply:"supply"};const key=map[type];state[key] ||= [];
 const count={fixed:3,spare:3,maint:5,fail:6,work:6,supply:6}[type];let vals=[];for(let i=0;i<count;i++)vals.push(document.getElementById("f"+i)?.value||"");
 state[key].push({machine:current,vals});save();renderMachine();
}
function editLog(type,i){
  const key=type, r=state[key]&&state[key][i]; if(!r)return;
  const labels={fixed:["Ekipman","Durum","Not"],spare:["Malzeme","Mevcut","Olması gereken / Not"],maint:["Bakım","Periyot","Tarih / Saat","Sonraki bakım","Not"],fail:["Tarih","Arıza","Değişen parça","Maliyet","Durum","Not"],work:["Tarih","İş / Şantiye","Yapılan iş","Saat / Metraj","Malzeme","Not"],supply:["Tarih","Malzeme / Parça","Miktar","Tedarikçi","Fiyat","Not"]}[type]||[];
  const vals=(r.vals||[]).slice();
  for(let j=0;j<labels.length;j++){ const v=prompt(labels[j]+":",vals[j]??""); if(v===null)return; vals[j]=v; }
  r.vals=vals; save(); renderMachine();
}
function delLog(type,i){const key=type; if(confirm("Kayıt silinsin mi?")){state[key].splice(i,1);save();renderMachine();}}
